name: Workspace Startup Safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  editor-autostart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject concealed editor startup execution
        run: python -m unittest discover -s tests -v
