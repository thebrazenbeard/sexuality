name: Workspace Startup Safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  editor-autostart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify repository safety and model-agnostic contracts
        run: python -B -m unittest discover -s tests -v
