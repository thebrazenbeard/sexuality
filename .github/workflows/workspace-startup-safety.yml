name: Workspace Startup Safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  editor-autostart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require generic contract regression suite
        run: python -c "from pathlib import Path; assert Path('tests/test_generic_model_boundary.py').is_file()"
      - name: Reject concealed editor startup execution
        run: python -m unittest discover -s tests -v
